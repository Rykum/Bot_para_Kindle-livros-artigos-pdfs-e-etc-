<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Media Bot PT-BR</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">📚 Media Bot</div>
      <nav>
        <button class="nav-item active" data-view="dashboard">Dashboard</button>
        <button class="nav-item" data-view="search">Buscar</button>
        <button class="nav-item" data-view="library">Biblioteca</button>
        <button class="nav-item" data-view="downloads">Downloads</button>
        <button class="nav-item" data-view="tools">Ferramentas</button>
      </nav>
      <div class="sidebar-foot" id="conn-state">Conectando…</div>
    </aside>
    <main class="content">
      <section id="view-dashboard" class="view active"><h1>Dashboard</h1><div id="dash-cards" class="card-grid"></div></section>
      <section id="view-search" class="view">
        <h1>Buscar</h1>
        <div class="form-row">
          <input id="q" placeholder="Título da série" value="Dandadan" />
          <select id="media-type"><option>manga</option><option>livro</option><option>hq</option><option>manhwa</option><option>artigo</option></select>
          <button id="btn-search" class="btn accent">Buscar</button>
        </div>
        <div id="search-results" class="card-grid"></div>
      </section>
      <section id="view-chapters" class="view">
        <div class="row-between">
          <h1 id="chapters-title">Capítulos</h1>
          <button id="btn-chapters-back" class="btn">← Voltar</button>
        </div>
        <div class="form-row">
          <label title="Idioma principal da busca/download">Idioma
            <select id="lang-primary"><option value="pt-br">pt-br</option><option value="en">en</option><option value="es">es</option></select>
          </label>
          <label title="Idioma usado só se o capítulo não vier no principal, após esgotar as re-tentativas">Fallback
            <select id="lang-fallback"><option value="">nenhum</option><option value="pt-br">pt-br</option><option value="en">en</option><option value="es">es</option></select>
          </label>
        </div>
        <p id="chapters-summary" class="muted">—</p>
        <div class="form-row">
          <button id="btn-download-all" class="btn success">Baixar tudo (faltantes)</button>
          <span class="muted">Intervalo:</span>
          <input id="range-from" type="number" min="0" style="max-width:90px" placeholder="de" />
          <input id="range-to" type="number" min="0" style="max-width:90px" placeholder="até" />
          <button id="btn-range-apply" class="btn">Aplicar</button>
          <button id="btn-download-selected" class="btn accent" disabled>Baixar selecionados (0)</button>
        </div>
        <div id="chapter-grid" class="chapter-grid"></div>
      </section>
      <!-- Capas: placeholder inline (data-URI SVG, sem CDN) via COVER_PLACEHOLDER em app.js;
           substituído em tempo de execução pela capa real retornada por Api.enrich_metadata. -->
      <section id="view-library" class="view"><h1>Biblioteca</h1><div id="library-cards" class="card-grid"></div></section>
      <section id="view-downloads" class="view">
        <h1>Downloads</h1>
        <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
        <div id="progress-text" class="muted">Sem download em andamento.</div>
        <button id="btn-cancel" class="btn warn">Cancelar download</button>
        <div class="form-row">
          <button id="btn-queue-pause" class="btn">Pausar fila</button>
          <button id="btn-queue-clear" class="btn">Limpar concluídos</button>
          <span id="queue-counts" class="muted">—</span>
        </div>
        <div id="queue-list" class="queue-list"></div>
        <pre id="log" class="log"></pre>
      </section>
      <section id="view-tools" class="view">
        <h1>Ferramentas</h1>
        <div class="form-row">
          <button id="btn-cache" class="btn warn">Limpar cache</button>
          <button id="btn-graph" class="btn">Status do grafo</button>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
